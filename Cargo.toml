[package]
name = "outer"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "A personal software forge for AI agents: MCP in, live Ilha apps out."
repository = "https://github.com/ryuzcorp/outer"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.23"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
constant_time_eq = "0.6"
futures = "0.3"
hex = "0.4"
hmac = "0.13"
libc = "0.2"
rand = "0.10"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "rustls",
  "stream",
] }
rusty-s3 = "0.10.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", features = [
  "runtime-tokio",
  "sqlite",
  "chrono",
  "uuid",
  "migrate",
] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }
zstd = "0.14"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }

[profile.release]
codegen-units = 1
lto = "thin"
