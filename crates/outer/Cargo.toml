[package]
name = "outer"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "A personal software forge for AI agents: MCP in, live Ilha apps out."
repository = "https://github.com/ryuzcorp/outer"
publish = false

[dependencies]
argon2 = { version = "0.5", features = ["std", "password-hash"] }
aes-gcm = "0.10"
anyhow = "1"
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls"] }
base64 = "0.23"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
constant_time_eq = "0.6"
croner = "4.0.2"
futures = "0.3"
 hex = "0.4"
hkdf = "0.13"
hmac = "0.13"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "tokio", "http1"] }
libc = "0.2"
maud = "0.27.0"
oxc_allocator = "0.155"
oxc_ast = "0.155"
oxc_ast_visit = "0.155"
oxc_parser = "0.155"
oxc_span = "0.155"
rand = "0.10"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "rustls",
  "stream",
] }
rustls = { version = "0.23", default-features = false, features = [
  "std",
  "tls12",
  "aws_lc_rs",
] }
rusty-s3 = "0.10.2"
qrcode = "0.14"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", features = [
  "runtime-tokio",
  "sqlite",
  "chrono",
  "uuid",
  "migrate",
] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5.8"
uuid = { version = "1", features = ["serde", "v4"] }
zip = "2"
zstd = "0.14"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
rcgen = "0.14"
