# Outer production service: one container on the VPS. This file lives at
# /srv/outer/compose.yaml on the host; `deploy/release.sh` uploads it and
# runs `docker compose --env-file /srv/outer/release.env -f
# /srv/outer/compose.yaml up -d`. Runtime env comes from /srv/outer/outer.env
# (see outer.env.example); release.env carries only OUTER_IMAGE (plus
# OUTER_PREVIOUS_IMAGE for rollback).
#
# Networking: `network_mode: host` on purpose. The host nftables INPUT
# policy (deploy/firewall.sh) drops every inbound connection, so nothing
# reaches the origin from outside; cloudflared (a host process) proxies the
# tunnel to 127.0.0.1:8443 on loopback, and the OUTPUT hook admits only uid
# 0 and cloudflared there. The fleet loopback ports (OUTER_FLEET_PORTS)
# stay on host loopback either way.
name: outer

services:
  outer:
    image: ${OUTER_IMAGE:?set OUTER_IMAGE in /srv/outer/release.env (deploy/release.sh writes it)}
    restart: unless-stopped
    # The image is local-only (deploy/release.sh streams it in with
    # save|load): never pull, so a missing image fails closed instead of
    # running a same-named registry image with the production env.
    pull_policy: never
    network_mode: host
    # Above outer's stop budget: on SIGTERM outer refuses new deploys and
    # waits out the in-flight ones (a release handoff drains this way), and
    # only then stops fleets concurrently (each at most ~20 s: StopGrace is
    # 15 s SIGTERM + 5 s SIGKILL) and writes the final state snapshot. Stops
    # with no in-flight deploys exit at once; the grace period is a cap, not
    # a delay. `docker stop -t` on the command line overrides this per stop.
    stop_grace_period: 15m
    # Tenant isolation: dropping to the app/fleet uids, owning worktrees, the
    # nft egress policy (needs NET_ADMIN), and per-fleet cgroup leaves.
    # The cgroup leaves need a writable cgroupfs mount: CAP_SYS_ADMIN lets
    # outer remount its own cgroup subtree writable at boot, and the
    # apparmor lift is required because Docker's default profile denies
    # mount(2) outright on Ubuntu. No `cgroup:` compose knob exists for this:
    # outer anchors its groups under its own placement (a private cgroup
    # namespace reports `/`, which is already outer's cgroup); it only needs
    # the mount writable, which these two grants provide.
    cap_add: [NET_ADMIN, SETUID, SETGID, CHOWN, SYS_ADMIN]
    security_opt: [apparmor:unconfined]
    env_file:
      - /srv/outer/outer.env
    volumes:
      # SQLite, git mirrors, worktrees, caches: the bucket can rebuild all of
      # it via the snapshot restore, but the live DB lives here.
      - /srv/outer/data:/data
      # Review-logins file (OUTER_REVIEW_LOGINS_FILE). Read-only: the
      # container never writes secrets.
      - /srv/outer/tls:/tls:ro
      # Legal pages (OUTER_LEGAL_DIR). Host-only files, never committed:
      # read per request, so host edits go live without a rollout.
      - /srv/outer/legal:/legal:ro
    # No HTTP healthcheck on purpose: the rollout verifies instead (the
    # container running on the new image + outer's "listening on" log line,
    # see deploy/release.sh).
