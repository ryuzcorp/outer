name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      # Real-oxfmt coverage for format-on-commit: a `bun x` shim stands in
      # for the image's /usr/local/bin/oxfmt (same pinned version as
      # docker/Dockerfile and the template). Filtered to the one ignored
      # test so no other ignored (privileged) tests run.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: |
          printf '#!/bin/sh\nexec "$HOME/.bun/bin/bun" x --package oxfmt@0.74.0 oxfmt "$@"\n' > /tmp/oxfmt
          chmod +x /tmp/oxfmt
          OUTER_TEST_OXFMT_BIN=/tmp/oxfmt cargo test --locked format_real_oxfmt -- --ignored

  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run doctor
      - run: bun run validate
      - run: bun run build

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - run: shellcheck deploy/*.sh
