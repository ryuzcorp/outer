name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by commit SHA (a moved tag can't change CI); the
      # Rust toolchain comes from rust-toolchain.toml.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      # Real-oxfmt coverage for format-on-commit: the same install and shim
      # as docker/Dockerfile (pinned oxfmt run by an absolute bun path,
      # because commits run the formatter with a cleared environment).
      # Filtered to the one ignored test so no other ignored (privileged)
      # tests run.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: |
          mkdir -p /tmp/oxfmt-install && cd /tmp/oxfmt-install
          bun add --exact oxfmt@0.74.0
          printf '#!/bin/sh\nexec %s /tmp/oxfmt-install/node_modules/oxfmt/dist/cli.js "$@"\n' "$(command -v bun)" > /tmp/oxfmt
          chmod +x /tmp/oxfmt
          env -i /tmp/oxfmt --version
          cd "$GITHUB_WORKSPACE"
          OUTER_TEST_OXFMT_BIN=/tmp/oxfmt cargo test --locked format_real_oxfmt -- --ignored
  # The §12.7 beta gate: the non-privileged hostile layer runs on every PR
  # touching the sandbox paths (fleet/, deploy/, store/credentials.rs, the
  # Dockerfile). The privileged layer cannot run here (needs root, cgroupfs
  # delegation and nft); the integrator runs it on the VPS with
  # scripts/hostile-suite.sh.
  hostile-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: gate
        with:
          # On pushes to main the base is the previous commit, so a sandbox
          # change merged without the gate still runs it.
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          filters: |
            sandbox:
              - 'crates/outer/src/fleet/**'
              - 'crates/outer/src/deploy/**'
              - 'crates/outer/src/store/credentials.rs'
              - 'docker/Dockerfile'
              - 'e2e/hostile/**'
              - 'crates/outer/tests/hostile.rs'
      - run: rustup toolchain install
        if: steps.gate.outputs.sandbox == 'true'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: steps.gate.outputs.sandbox == 'true'
      - run: cargo test --locked hostile
        if: steps.gate.outputs.sandbox == 'true'

  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run doctor
      - run: bun run validate
      - run: bun run build

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - run: shellcheck deploy/*.sh scripts/*.sh
      - run: scripts/check-pins.sh
